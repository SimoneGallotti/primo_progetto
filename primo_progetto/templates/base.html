{% load static %}
<!doctype html>
<html lang="it">
  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>

    <title>{% block title %} Primo progetto {% endblock title %}</title>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <a class="navbar-brand" href="{% url 'index_root' %}">Primo progetto</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownPrima" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Prima app
            </a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdownPrima">
              <a class="dropdown-item" href="{% url 'prima_app:index' %}">Index</a>
              <a class="dropdown-item" href="{% url 'prima_app:welcome' %}">Welcome</a>
              <a class="dropdown-item" href="{% url 'prima_app:lista' %}">Menu</a>
              <a class="dropdown-item" href="{% url 'prima_app:chi_siamo' %}">Chi Siamo</a>
              <a class="dropdown-item" href="{% url 'prima_app:variabili' %}">Variabili</a>
              <a class="dropdown-item" href="{% url 'prima_app:homepage' %}">Homepage</a>
            </div>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownSeconda" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Seconda app
            </a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdownSeconda">
              <a class="dropdown-item" href="#">Index</a>
            </div>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container my-4">
      {% block content %}
      {% endblock content %}

      {% block script %}
      {% endblock script %}
    </div>
   
  </body>
</html>
